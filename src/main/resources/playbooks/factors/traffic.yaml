# 流量因子：流量与转化对比
# 无数据依赖：仅按时间范围查询对比，不引用其他步骤的产出
factor: traffic
steps:
  - step_id: compare_traffic_conversion
    name: 流量与转化对比
    capabilities: [traffic_conversion_query]
    params: { time_range: "{{time_range}}", baseline: "{{comparison_baseline}}" }
    outputs: [traffic_delta, conversion_delta]
