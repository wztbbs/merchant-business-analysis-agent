# 价格因子：排查价格异常变化
factor: price
steps:
  - step_id: check_price_change
    name: 价格变化排查
    # 该模板依赖诊断骨架的贡献榜；独立工具也可以直接指定 sku 或 sku_ids。
    depends_on: [contribution_breakdown]
    inputs: { top_contributors: "contribution_breakdown.top_contributors" }
    capabilities: [price_change_query]
    params: { sku: "{{entity.sku}}", time_range: "{{time_range}}" }
    outputs: [price_changes]
