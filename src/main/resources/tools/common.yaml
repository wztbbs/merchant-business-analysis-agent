reference:
  type: "object"
  properties:
    $ref:
      type: "string"
      pattern: "^[A-Za-z][A-Za-z0-9_]*(\\.(?:[A-Za-z_][A-Za-z0-9_]*|[0-9]+))+$"
  required: ["$ref"]
  additionalProperties: false
decimal:
  anyOf:
    -
      type: "number"
    -
      type: "string"
      maxLength: 2048
      pattern: "^[+-]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+)?$"
time_range:
  description: "按业务日期查询。省略时继承本次分析已固定的日期；可传时间意图、已解析日期或结果引用。"
  anyOf:
    -
      oneOf:
        -
          type: "object"
          properties:
            type:
              const: "calendar_period"
            unit:
              enum: ["day", "week", "month", "quarter", "year"]
            offset:
              type: "integer"
              maximum: 0
          required: ["type", "unit", "offset"]
          additionalProperties: false
        -
          type: "object"
          properties:
            type:
              const: "recent_days"
            days:
              type: "integer"
              minimum: 1
          required: ["type", "days"]
          additionalProperties: false
        -
          type: "object"
          properties:
            type:
              const: "date_range"
            start:
              type: "string"
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            end:
              type: "string"
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          required: ["type", "start", "end"]
          additionalProperties: false
        -
          type: "object"
          properties:
            start:
              type: "string"
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            endExclusive:
              type: "string"
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          required: ["start", "endExclusive"]
          additionalProperties: false
    -
      $ref: "common:reference"
contributor:
  type: "object"
  properties:
    sku_id:
      type: "string"
    name:
      type: "string"
    category:
      anyOf:
        -
          type: "string"
        -
          type: "null"
    current_total:
      description: "观察期销售额，单位元。"
      type: "number"
    baseline_total:
      description: "基线期销售额，单位元。"
      type: "number"
    delta:
      description: "观察期销售额减基线期销售额，单位元，保留符号。"
      type: "number"
  required: ["sku_id", "name", "category", "current_total", "baseline_total", "delta"]
  additionalProperties: false
