name: "compare"
description: "比较大小，返回greater/less/equal。数值引用上游结果，调用者需保证指标、时间和单位可比。"
input_schema:
  type: "object"
  properties:
    input:
      type: "object"
      properties:
        left:
          anyOf:
            -
              $ref: "common:decimal"
            -
              $ref: "common:reference"
        right:
          anyOf:
            -
              $ref: "common:decimal"
            -
              $ref: "common:reference"
      required: ["left", "right"]
      additionalProperties: false
  required: ["input"]
  additionalProperties: false
output_schema:
  type: "object"
  properties:
    value:
      description: "计算结果的十进制字符串，可供后续算子引用。"
      type: "string"
    relation:
      enum: ["greater", "less", "equal"]
  required: ["value", "relation"]
  additionalProperties: false
